{% extends "base.html" %}

{% block content %}
{% set posts = get_section(path="posts/_index.md") %}
<section class="shell home-section">
  <div class="section-heading">
    <h2>最新の記事</h2>
    <a class="text-link" href="{{ get_url(path='@/posts/_index.md') }}">すべての記事 <span>→</span></a>
  </div>
  <div class="post-list">
    {% for page in posts.pages %}
      {% if loop.index <= 3 %}{% include "partials/post-row.html" %}{% endif %}
    {% else %}
      <p class="empty">最初の記事を準備中です。</p>
    {% endfor %}
  </div>
</section>
{% endblock content %}
